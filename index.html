<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>远古森语 · 恐龙百科</title>
<link rel="icon" href="data:,">
<style>@font-face{font-family:"Noto Serif SC";font-weight:400;font-display:swap;src:url(tex/serif-Regular.woff2) format("woff2")}@font-face{font-family:"Noto Serif SC";font-weight:700;font-display:swap;src:url(tex/serif-Bold.woff2) format("woff2")}</style>
</head>
<body>
<canvas id="fireflies"></canvas>
<div class="fog"></div>
<header class="topbar">
  <a class="brand" href="#/"><span class="glyph">◈</span> 远古森语<small>恐龙百科</small></a>
  <nav>
    <a href="#/" data-nav="home">地球</a>
    <a href="#/browse" data-nav="browse">图鉴</a>
    <a href="#/groups" data-nav="groups">分类</a>
    <a href="#/credits" data-nav="credits">版权与来源</a>
  </nav>
</header>
<main id="app">
  <section id="view-home" class="view">
    <div id="globe-wrap"><div id="globe"></div><div class="globe-tip" id="globe-tip"></div></div>
    <div class="hero-mini glass">
      <p class="eyebrow">MESOZOIC · 中生代 · 2.37 亿 – 6600 万年前</p>
      <h1>在暗森之中，聆听恐龙的回响</h1>
      <div class="stats" id="stats"></div>
      <div class="globe-note" id="globe-note"></div>
    </div>
    <button class="drawer-btn glass" id="drawer-btn" aria-label="恐龙列表">☰ 名录</button>
    <aside class="drawer glass" id="drawer">
      <div class="dr-head"><b>化石名录</b><button class="x" id="drawer-x" aria-label="收起">×</button></div>
      <input id="dq" type="search" placeholder="搜索中文名 / 拉丁名 / 产地">
      <div class="dr-filters"><select id="d-group"></select><select id="d-diet"></select><select id="d-region"></select></div>
      <div class="count" id="d-count"></div>
      <div class="dr-list" id="tl-list"></div>
    </aside>
    <aside class="preview glass" id="preview"></aside>
    <div class="timeline-card glass">
      <div class="tl-head"><div><span class="tl-label">地质年代</span> <b id="tl-ma"></b></div>
        <label class="chk"><input type="checkbox" id="tl-all"> 全部时代</label></div>
      <div class="tl-track" id="tl-track"></div>
      <input type="range" id="tl-range" min="0" max="171" step="0.5" value="150">
    </div>
  </section>
  <section id="view-browse" class="view">
    <h2 class="sec-title">恐龙图鉴</h2>
    <div class="filters">
      <input id="q" type="search" placeholder="搜索 中文名 / 拉丁名 / 产地…">
      <select id="f-period"></select><select id="f-group"></select><select id="f-diet"></select><select id="f-region"></select>
      <span id="count" class="count"></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>
  <section id="view-groups" class="view"><h2 class="sec-title">分类系统</h2><div id="groups"></div></section>
  <section id="view-credits" class="view"><h2 class="sec-title">版权与来源</h2><div id="credits"></div></section>
  <section id="view-dino" class="view"><div id="detail"></div></section>
</main>
<footer class="foot">远古森语 · 恐龙百科 — 数据整理自公开学术资料，数值为估计值 · <a href="#/credits">素材来源</a></footer>
<script type="module" src="/src/main.js"></script>
</body></html>
